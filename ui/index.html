<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juggl</title>
<style>
:root{
  --bg:#ffffff; --side:#f4f4f3; --ink:#161616; --ink2:#5d5d61; --ink3:#6e6e73;   /* greys (12/11): --ink3 at least 4.5:1 on the sidebar too (it was #9a9a9f, 2.8:1) */ --line:rgba(0,0,0,.08);
  --fill:rgba(0,0,0,.05); --fill2:rgba(0,0,0,.08); --sel:#1d1d1f; --selink:#ffffff; --selink2:rgba(255,255,255,.62);
  --bolla:#1d1d1f; --bollaink:#ffffff; --code:rgba(0,0,0,.045); --err:#c4372d;
  --av1:#b4b4b9; --av2:#8e8e93;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --serif:ui-serif,"New York",Georgia,serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  /* typography (16/11): size of the reply text (ui/typography.js, ⌘+ ⌘−) and a column that grows with it: ~74 characters per line */
  --t:15px; --col:calc(var(--t) * var(--k-testo) + 56px);
  /* width (16/11): text column and photo/table/code column, in "characters" of the text size.
     Wide ~140 characters per line (default); Normal ~100; Narrow ~74 (the 0.1.80 one). Chosen in ui/typography.js (data-larghezza). */
  --k-testo:62; --k-media:80;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1b1d; --side:#232325; --ink:#f3f3f1; --ink2:#a8a8ad; --ink3:#8e8e93; --line:rgba(255,255,255,.08);
    --fill:rgba(255,255,255,.06); --fill2:rgba(255,255,255,.1); --sel:#e9e9e7; --selink:#151515; --selink2:rgba(0,0,0,.55);
    --bolla:#ececea; --bollaink:#151515; --code:rgba(255,255,255,.07); --err:#ff7b72; --av1:#6e6e73; --av2:#4a4a4e; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* text selectable everywhere; blocked only on interface controls */
button,.side,.barra,.piede,.vtop,.vpiede,.opz,.az-testa,.media,.sa,.chip,.sezione,.info-pane h4,.giorno,.stato-invio{-webkit-user-select:none;user-select:none}
.barra h2[contenteditable=true]{-webkit-user-select:text;user-select:text}
.thread ::selection,.compito::selection{background:rgba(120,120,128,.35)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:default}

.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"side fascia" "side nastro" "side main";height:100vh}
.app.info{grid-template-columns:320px 1fr 280px;grid-template-areas:"side fascia fascia" "side nastro nastro" "side main info"}
.side{grid-area:side}.main{grid-area:main}.info-pane{grid-area:info}#fascia{grid-area:fascia}

/* ---------- list ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding:46px 16px 10px}
.titolo-app{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.titolo-app h1{font:600 22px/1 var(--serif);letter-spacing:-.01em;margin:0}
.presenza{margin-left:auto;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.presenza i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.presenza.on i{background:#34a065}
.cerca{display:flex;align-items:center;gap:6px;background:var(--fill2);border-radius:9px;padding:6px 9px;color:var(--ink3)}
.cerca input{flex:1;border:0;background:none;outline:none;font:inherit;color:var(--ink);min-width:0}
.cerca input::placeholder{color:var(--ink3)}
.elenco{overflow:auto;flex:1;padding:4px 8px 20px}
.sezione{font-size:11px;font-weight:600;color:var(--ink3);padding:12px 10px 5px;display:flex;gap:6px}
/* Archived: at the bottom of the list, closed by default */
.arch-testa{display:flex;align-items:center;gap:6px;width:100%;font-size:11px;font-weight:600;color:var(--ink3);padding:16px 10px 6px;text-align:left;border-top:1px solid var(--line);margin-top:10px}
.arch-testa:hover{color:var(--ink)}
.arch-testa svg{width:9px;height:9px;transition:transform .2s}
.arch-testa.aperta svg{transform:rotate(90deg)}
.arch-testa .n{font-weight:500}
.arch-strumenti{display:flex;gap:6px;padding:2px 4px 6px}
.arch-strumenti input,.arch-strumenti select{border:0;background:var(--fill2);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;color:var(--ink);outline:none;min-width:0}
.arch-strumenti input{flex:1}
.arch-strumenti input::placeholder{color:var(--ink3)}
.arch-strumenti select{max-width:44%;color:var(--ink2);-webkit-appearance:none;appearance:none;padding-right:8px}
.arch-riga{display:grid;grid-template-columns:28px 1fr;gap:0 10px;align-items:center;width:100%;text-align:left;border-radius:10px;padding:7px 10px 7px 12px;margin:1px 0}
.arch-riga:hover{background:var(--fill)}
.arch-riga .av{opacity:.55}
.arch-riga .nome{font-size:13px;font-weight:500;color:var(--ink2)}
.arch-riga .anteprima{-webkit-line-clamp:1;font-size:12px;color:var(--ink3);min-height:0}
.arch-riga.sel{background:var(--sel)}
.arch-riga.sel .nome{color:var(--selink)}.arch-riga.sel .ora,.arch-riga.sel .anteprima{color:var(--selink2)}.arch-riga.sel .av{opacity:1}
.arch-vuoto{font-size:12px;color:var(--ink3);padding:8px 12px}
.arch-auto{display:flex;align-items:center;gap:8px;padding:10px 6px 4px 12px;font-size:11px;color:var(--ink3)}
.arch-auto span{flex:1}
.arch-seg{display:flex;background:var(--fill2);border-radius:7px;padding:2px}
.arch-seg button{font-size:10.5px;padding:2px 7px;border-radius:5px;color:var(--ink3)}
.arch-seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.vista-arch .riprendi .tasto{border:1px solid var(--line)}
.riga{display:grid;grid-template-columns:10px 40px 1fr;gap:0 9px;align-items:center;width:100%;text-align:left;border-radius:11px;padding:9px 10px 9px 4px;margin:1px 0}
.riga:hover{background:var(--fill)}
.riga.sel{background:var(--sel);color:var(--selink)}
.punto{width:9px;height:9px;border-radius:50%;justify-self:center}
.aspetta .punto,.bloccata .punto{background:#ff5b1f}
.fatta .punto{border:1.5px solid var(--ink2);width:8px;height:8px}
.riga.sel.aspetta .punto,.riga.sel.bloccata .punto{background:#ff5b1f}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--av1),var(--av2));color:#fff;display:grid;place-items:center;font:600 14px/1 var(--sans);letter-spacing:.02em}
.av.piccolo{width:28px;height:28px;font-size:11px}
.av.logo{background:#fff;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.av.logo img{width:100%;height:100%;object-fit:contain}
.ibernata .av{opacity:.5}
.mem{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.mem.alta{color:var(--err);font-weight:600}
.riga.sel .mem{color:var(--selink2)}
.nuova-btn{margin-left:8px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink2)}
.nuova-btn:hover{background:var(--fill2);color:var(--ink)}
.piede{border-top:1px solid var(--line);padding:9px 16px 11px;font-size:11px;color:var(--ink3)}
.piede .barra-mem{height:4px;border-radius:2px;background:var(--fill2);margin-top:5px;overflow:hidden}
.piede .barra-mem i{display:block;height:100%;background:var(--ink2);border-radius:2px}
.piede.allarme{color:var(--err)}.piede.allarme .barra-mem i{background:var(--err)}
.tasto.pericolo{color:var(--err)}
.tasto.conferma{background:var(--err);color:#fff}
.riprendi{max-width:var(--col);margin:0 auto;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.riprendi span{flex:1;color:var(--ink2);font-size:13px}
/* resuming a hibernated chat: a thin line above the input box (which always stays), then it closes by sliding */
.compositore .r-riprendibox{display:flex;align-items:center;gap:8px;border:0;border-radius:0;padding:0 6px;height:0;opacity:0;overflow:hidden;margin:0 auto;
  transition:height .3s cubic-bezier(.2,.9,.25,1),opacity .22s ease,margin .3s cubic-bezier(.2,.9,.25,1)}
.compositore .r-riprendibox.on{height:30px;opacity:1;margin:0 auto 6px}
.compositore .r-riprendibox span{flex:1;min-width:0;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compositore .r-riprendibox em{font-style:normal;color:var(--ink3)}
.compositore .r-riprendibox svg{width:13px;height:13px;color:var(--ink3);flex:none}
.compositore .r-riprendibox .tasto{font-size:12px;padding:3px 11px;border:1px solid var(--line);border-radius:8px;color:var(--ink2)}
.compositore .r-riprendibox .tasto:hover{background:var(--fill);color:var(--ink)}
.rp-punto{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:rppulsa 1.6s ease-in-out infinite}
@keyframes rppulsa{0%,100%{opacity:1}50%{opacity:.25}}
.rp-err{flex:none;width:7px;height:7px;border-radius:50%;background:var(--err)}
@media (prefers-reduced-motion: reduce){.compositore .r-riprendibox{transition:none}.rp-punto{animation:none}}
.btn-nero{background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 13px;font-weight:500;font-size:13px}
.velo{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.28);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.velo.on{display:flex}
.foglio{width:min(520px,92vw);background:var(--bg);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);border:1px solid var(--line);padding:18px}
.foglio h3{font:600 17px/1.2 var(--serif);margin:0 0 12px}
.foglio label{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px}
.chip .av{width:20px;height:20px;font-size:8.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.foglio input,.foglio textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--fill);color:var(--ink);font:13px var(--sans);padding:8px 10px;outline:none}
.foglio input{font-family:var(--mono);font-size:12px}
.foglio textarea{min-height:80px;resize:vertical}
.foglio .piedef{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.foglio .piedef small{flex:1;color:var(--ink3);font-size:11.5px}
.corpo{min-width:0}
.r1{display:flex;align-items:baseline;gap:8px}
.nome{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ferma .nome{font-weight:500}
.ora{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.anteprima{font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px;min-height:18px}
.riga.sel .ora,.riga.sel .anteprima{color:var(--selink2)}
.forte{font-weight:600;color:var(--ink)}
.riga.sel .forte{color:var(--selink)}
.scrive{display:inline-flex;gap:3px;align-items:center;background:var(--fill2);border-radius:10px;padding:5px 8px;vertical-align:middle;margin-right:6px}
.scrive i{width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:onda 1.2s infinite ease-in-out}
.scrive i:nth-child(2){animation-delay:.15s}.scrive i:nth-child(3){animation-delay:.3s}
.riga.sel .scrive{background:rgba(127,127,127,.3)}
@keyframes onda{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.vuoto{color:var(--ink3);text-align:center;padding:40px 16px}
.pronta-scheda{margin:18px auto 8px;max-width:560px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink2);font-size:13px}
.pronta-scheda b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.pronta-scheda p{margin:0 0 8px}
.pronta-scheda .pr-righe{color:var(--ink3);font-size:12px}
.pronta-scheda .pr-az{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.pronta-scheda details{flex:1 1 100%}
.pronta-scheda summary{cursor:default;color:var(--ink);font-weight:500;font-size:12.5px;list-style:none}
.pronta-scheda summary::before{content:"▸ ";color:var(--ink3)}
.pronta-scheda details[open] summary::before{content:"▾ "}
.pronta-scheda .pr-ctx{margin-top:8px;max-height:320px;overflow:auto;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;-webkit-user-select:text;user-select:text}

/* ---------- conversation ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.barra{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 22px;border-bottom:1px solid var(--line)}
.barra .tit{min-width:0;flex:1}
.barra h2{font:600 15px/1.2 var(--serif);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tasto{height:28px;border-radius:7px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px}
.barra .r-ferma{max-width:140px;overflow:hidden;white-space:nowrap;transition:max-width .24s cubic-bezier(.2,.8,.2,1),padding .24s cubic-bezier(.2,.8,.2,1),margin .24s cubic-bezier(.2,.8,.2,1),opacity .18s ease}
.barra .r-ferma.off{max-width:0;padding-left:0;padding-right:0;margin-right:-10px;opacity:0;pointer-events:none;visibility:hidden;transition:max-width .24s cubic-bezier(.2,.8,.2,1),padding .24s cubic-bezier(.2,.8,.2,1),margin .24s cubic-bezier(.2,.8,.2,1),opacity .18s ease,visibility 0s .24s}
@media (prefers-reduced-motion:reduce){.barra .r-ferma,.barra .r-ferma.off{transition:none}}
.tasto:hover{background:var(--fill)}
.tasto.on{background:var(--fill2);color:var(--ink)}
.tasto svg{width:15px;height:15px}
.scroll{flex:1;overflow:auto;min-height:0}
.thread{max-width:var(--col);margin:0 auto;padding:22px 28px 30px}
.giorno{text-align:center;font-size:11px;color:var(--ink3);margin:18px 0 10px}
.tu{display:flex;justify-content:flex-end;margin:10px 0}
.bolla{background:var(--bolla);color:var(--bollaink);border-radius:18px;padding:8px 13px;max-width:82%;font-size:calc(var(--t) - .5px);line-height:1.47;word-wrap:break-word}
.bolla.md p{margin:0 0 .45em}.bolla.md>*:last-child{margin-bottom:0}
.bolla.md code{background:rgba(127,127,127,.22)}.bolla.md pre{background:rgba(127,127,127,.18)}
.bolla.md ul,.bolla.md ol{margin:.2em 0 .45em}.bolla.md a{text-decoration-color:currentColor}
.sistema{margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--ink2)}
.sistema summary{cursor:pointer;color:var(--ink3);list-style:none;display:flex;align-items:center;gap:6px}
.sistema summary::before{content:"›";display:inline-block;transition:transform .15s}
.sistema[open] summary::before{transform:rotate(90deg)}
.sistema .md{margin-top:8px;max-height:320px;overflow:auto;font-size:12.5px}
.agente{margin:12px 0;font-size:var(--t);line-height:1.6;letter-spacing:-.003em}
.azioni{margin:6px 0}
.az-testa{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:12.5px;padding:3px 8px 3px 6px;border-radius:7px}
.az-testa:hover{background:var(--fill);color:var(--ink2)}
.az-testa svg{width:11px;height:11px;transition:transform .15s}
.azioni.aperte .az-testa svg{transform:rotate(90deg)}
.az-lista{display:none;border-left:1.5px solid var(--line);margin:4px 0 6px 11px;padding:2px 0 2px 12px}
.azioni.aperte .az-lista{display:block}
.ev{font:12px/1.5 var(--mono);color:var(--ink2);padding:2px 0;display:flex;gap:8px}
.ev b{font-weight:500;color:var(--ink3);flex:none;min-width:44px}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.aperto span{white-space:pre-wrap;word-break:break-all}
.ev.err{color:var(--err)}
.ev.neutro b{color:var(--ink3)}.ev.neutro span{color:var(--ink3)}
/* groups of commands described in Italian (summaries.rs): sentence on top, "Adesso" line on the last group still working */
.az-frase{margin:2px 0 1px 6px;font-size:12.5px;line-height:1.45;color:var(--ink3);max-width:640px;animation:azentra .35s ease}
@keyframes azentra{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.az-adesso{display:flex;align-items:center;gap:7px;margin:1px 0 2px 8px;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:640px}
.az-adesso i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:jpulsa 1.4s ease-in-out infinite}
.az-adesso b{font-weight:500;color:var(--ink2)}
.md p{margin:0 0 .85em}.md>*:last-child{margin-bottom:0}
.md strong{font-weight:600}
.md code{font:12.5px var(--mono);background:var(--code);padding:1px 5px;border-radius:5px}
.md pre{font:12px/1.5 var(--mono);background:var(--code);padding:12px 14px;border-radius:10px;overflow:auto;margin:.5em 0 .9em}
.md pre code{background:none;padding:0}
.md ul,.md ol{margin:.1em 0 .95em;padding-left:1.2em}.md li{margin:.3em 0;padding-left:.1em}.md li::marker{color:var(--ink3)}
/* typography (16/11): real heading levels (md(): # and ## -> h2, ### -> h3, #### -> h4) */
.md h2{font:600 1.27em/1.3 var(--serif);letter-spacing:-.01em;margin:1.5em 0 .5em}
.md h3{font:600 1em/1.35 var(--sans);margin:1.35em 0 .35em}
.md h4{font:600 .9em/1.35 var(--sans);color:var(--ink2);margin:1.2em 0 .3em}
.bolla.md h2,.bolla.md h3,.bolla.md h4{font-size:1em;margin:.2em 0 .3em}
.md>h2:first-child,.md>h3:first-child,.md>h4:first-child{margin-top:.15em}
/* width (16/11): column measures; photos, tables, code and cards stick out of the text, centered, up to --k-media */
html[data-larghezza=normale]{--k-testo:44;--k-media:58}
html[data-larghezza=stretta]{--k-testo:32.8;--k-media:40}
html:not([data-larghezza=normale]):not([data-larghezza=stretta]) .agente{line-height:1.66}
.agente.md>pre,.agente.md>.cod2,.galleria:not(.tu){--lm:min(calc(var(--t) * var(--k-media)), 100cqw - 56px);width:var(--lm);max-width:none;margin-left:calc((100% - var(--lm)) / 2)}
/* tables: aligned with the text; when needed they widen to the right up to the edge of the wide column */
.agente.md>.jtab{--lm:min(calc(var(--t) * var(--k-media)), 100cqw - 56px);max-width:calc((100% + var(--lm)) / 2)}
.galleria:not(.tu){justify-content:center}
.galleria.una:not(.tu) .media img,.galleria.una:not(.tu) .media video{max-width:min(calc(var(--t) * var(--k-media)), 100%);max-height:520px}
/* typography (16/11): code over 6 lines collapsed into one line (language, lines, start, Copy); opens on click */
.md .cod2{border:1px solid var(--line);border-radius:10px;margin:.4em 0 1em;overflow:hidden}
.cod2>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:6px 8px 6px 11px;font:12px var(--sans);color:var(--ink3);cursor:default;-webkit-user-select:none;user-select:none}
.cod2>summary::-webkit-details-marker{display:none}
.cod2>summary:hover{background:var(--fill)}
.cod2>summary svg{flex:none;width:10px;height:10px;transition:transform .15s}
.cod2[open]>summary svg{transform:rotate(90deg)}
.cod2 .cod-l{font-weight:600;color:var(--ink2)}
.cod2 .cod-pr{flex:1;min-width:0;font:11.5px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cod2[open] .cod-pr{visibility:hidden}
.md .cod2 pre{margin:0;border-radius:0;border-top:1px solid var(--line)}
.cod2>summary .copia-cod{position:static;opacity:1;flex:none}

/* ---------- Juggl elements (```juggl-<type> in replies): sober cards, app palette ---------- */

.jc-passi li.corso .pt{box-shadow:inset 0 0 0 1.5px var(--ink)}
.jc-passi li.corso .pt::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);animation:jpulsa 1.4s ease-in-out infinite}
.jc-passi li.corso span{font-weight:500}
.jc-passi li.blocco .pt{box-shadow:inset 0 0 0 1.5px var(--err);color:var(--err);font:700 9px/1 var(--sans)}
.jc-passi li.blocco span{color:var(--err)}
.jc-passi li.todo span{color:var(--ink3)}
@keyframes jpulsa{0%,100%{opacity:1}50%{opacity:.3}}
.jc.vecchia{display:flex;align-items:baseline;gap:8px;padding:8px 12px;color:var(--ink2)}

.jc.sch{padding-bottom:12px}

.jc-dom{padding:10px 12px 8px;font-weight:500}
.jc-opz{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.jc-opz button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);color:var(--ink);font-size:12.5px;text-align:left;transition:background .15s,color .15s,opacity .15s}
.jc-opz button:hover{background:var(--fill)}
.jc-opz button b{font-weight:600;margin-right:5px}
.jc-opz button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jc-opz.fatta button:not(.sel){opacity:.4;pointer-events:none}
.jc-opz button:disabled{pointer-events:none}
.jc-mandato{padding:0 12px 10px;font-size:11.5px;color:var(--ink3)}
/* two-step confirmation: provisional choice (solid border) and a "Annulla / Conferma" line below */
.jc-opz button.prov{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--fill)}
.jc-opz.armata button:not(.prov){opacity:.55}
.conf2{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;animation:conf2In .16s ease-out}

.conf2-t b{color:var(--ink);font-weight:600}

.conf2 button.nero{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.conf2 button.nero:hover{opacity:.85}

.rq .conf2{padding:8px 0 0;margin-top:8px}.ic-blocco .conf2{padding:7px 0 0}
.ch-az button.prov,.rq footer button.prov,.ic-tasti button.prov{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.ch-ok.armata .ch-az button:not(.prov),.rq footer:has(.prov) button:not(.prov),.ic-tasti:has(.prov) button:not(.prov){opacity:.5}
@keyframes conf2In{from{opacity:0;transform:translateY(-3px)}}
.jn{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 1px 4px;margin:6px 0 12px;max-width:640px;scrollbar-width:none}

.md ul.jk{list-style:none;margin:0;padding:6px 12px 10px}

.jtab{max-width:100%;width:fit-content;margin:.5em 0 .9em;border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--bg)}

.jtab th .fr{opacity:.55;margin-left:3px}
.lavora-ora{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:12.5px;margin:14px 0}
.avviso{max-width:var(--col);margin:0 auto 10px;padding:0 28px}

.statoc{max-width:var(--col);margin:6px auto 0;padding:0 8px;display:flex;align-items:center;gap:6px 12px;font:11px/16px var(--sans);color:var(--ink3);white-space:nowrap;overflow:hidden;min-height:16px;font-variant-numeric:tabular-nums}

.benvenuto{margin:auto;text-align:center;color:var(--ink3)}

.adesso,.domanda{max-width:var(--col);margin:0 auto 8px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.08);animation:sale .32s cubic-bezier(.2,.9,.25,1)}
.adesso.esce,.domanda.esce{animation:scende .22s ease-in forwards}
@keyframes sale{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes scende{to{opacity:0;transform:translateY(8px) scale(.98)}}
.adesso{padding:10px 14px}
.ad-riga{display:flex;align-items:center;gap:10px;font-size:13px}
.ad-giro{width:14px;height:14px;border-radius:50%;border:2px solid var(--fill2);border-top-color:var(--ink);animation:gira .8s linear infinite;flex:none}
.ad-azione{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ad-tempo{font:12px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.ad-silenzio{font-size:12px;color:var(--ink3);white-space:nowrap}.ad-silenzio:empty{display:none}
.ad-passi{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.ad-barra{flex:1;height:4px;border-radius:2px;background:var(--fill2);overflow:hidden}
.ad-barra i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ad-conta{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ad-lista{display:flex;flex-direction:column;gap:3px;max-height:132px;overflow:auto}
.ad-passo{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3)}
.ad-passo.in_progress{color:var(--ink);font-weight:500}
.ad-passo.completed{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.ad-segno{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;flex:none}
.ad-passo.in_progress .ad-segno{border-color:var(--ink);border-top-color:transparent;animation:gira 1s linear infinite}
.ad-passo.completed .ad-segno{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ad-segno svg{width:9px;height:9px}
.ad-passo.appena .ad-segno{animation:pop .35s cubic-bezier(.2,1.4,.35,1)}
.ad-sotto{font-size:12px;color:var(--ink3);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sub-agents at work: one line each, fixed height (changing text does not make the box jump) */
.ad-salista{display:flex;flex-direction:column;gap:2px;margin:8px -6px 0;padding-top:8px;border-top:1px solid var(--line)}
.ad-sa{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-rows:18px 17px;grid-template-areas:"ic t tempo" "ic ora meta";column-gap:9px;align-items:center;text-align:left;width:100%;padding:5px 6px;border-radius:9px;color:var(--ink);transition:background .15s}
.ad-sa:hover{background:var(--fill)}
.ad-sa-ic{grid-area:ic;width:22px;height:22px;border-radius:7px;background:var(--fill2);display:grid;place-items:center;color:var(--ink2)}
.ad-sa-ic svg{width:12px;height:12px}
.ad-sa-t{grid-area:t;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-sa .ad-tempo{grid-area:tempo;font-size:11.5px;justify-self:end}
.ad-sa-ora{grid-area:ora;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-sa-ora.cambia{animation:oraNuova .45s ease}
@keyframes oraNuova{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
.ad-sa-ferma{position:absolute;right:6px;top:4px;display:none;font-size:11px;font-weight:500;line-height:16px;padding:1px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);cursor:pointer}
.ad-sa:hover .ad-sa-ferma{display:block}
.ad-sa-ferma:hover{color:var(--err);border-color:var(--err)}
#ferma-sa{margin-left:auto}
/* ---------- projects grouped in the list (10/11) ---------- */
.riga-gruppo{display:grid;grid-template-columns:10px 40px 1fr;gap:0 9px;align-items:center;width:100%;text-align:left;border-radius:11px;padding:9px 10px 9px 4px;margin:1px 0;position:relative}
.riga-gruppo:hover{background:var(--fill)}
.riga-gruppo.sel{background:var(--sel);color:var(--selink)}
.riga-gruppo.sel .ora,.riga-gruppo.sel .anteprima,.riga-gruppo.sel .gr-n{color:var(--selink2)}
.riga-gruppo.sel .forte{color:var(--selink)}
.riga-gruppo.sel.aspetta .punto,.riga-gruppo.sel.bloccata .punto{background:#ff5b1f}
.gr-n{font-size:11px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.gr-freccia{width:14px;height:14px;display:grid;place-items:center;color:var(--ink3);transition:transform .2s;flex:none;align-self:center}
.riga-gruppo.aperto .gr-freccia{transform:rotate(90deg)}
.riga.figlia{grid-template-columns:10px 28px 1fr;padding:6px 10px 6px 22px}
.riga.figlia .av{width:28px;height:28px;font-size:11px}
.riga.figlia .nome{font-size:13px}
.riga.figlia .anteprima{-webkit-line-clamp:1}
.riga.figlia::before{content:"";position:absolute;left:12px;top:-2px;bottom:50%;width:8px;border-left:1.5px solid var(--fill2);border-bottom:1.5px solid var(--fill2);border-bottom-left-radius:6px}

/* ---------- "In corso" view (10/11) ---------- */
.vista-ic{container-type:inline-size}
.vista-ic .barra{flex-wrap:wrap;row-gap:8px}
.ic-testa{display:flex;align-items:center;flex-wrap:wrap;column-gap:12px;row-gap:8px;flex:1;min-width:0}
.ic-testa h2{margin:0;font-size:17px;font-weight:650;white-space:nowrap;flex:none}
.ic-conta{display:flex;gap:6px;flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.ic-conta::-webkit-scrollbar{display:none}
.ic-chip{flex:none;white-space:nowrap;font-size:12px;line-height:16px;padding:3px 9px;border-radius:7px;background:var(--fill);color:var(--ink2);display:inline-flex;align-items:baseline;gap:4px}
.ic-chip b{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ic-chip.forte{background:var(--ink);color:var(--bg)}.ic-chip.forte b{color:var(--bg)}
@container (max-width:620px){ .ic-conta{flex-basis:100%;-webkit-mask-image:none} .ic-pagina{padding:14px 14px 30px} }
.ic-pagina{padding:18px 24px 40px;max-width:1500px}
.ic-sez{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.ic-sez b{color:var(--ink);font-variant-numeric:tabular-nums}
.ic-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px;margin-bottom:22px}
.ic-griglia.larga{grid-template-columns:minmax(0,1fr)}
.ic-sc{min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:13px 14px 12px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.ic-sc:hover{border-color:var(--fill2);box-shadow:0 6px 22px rgba(0,0,0,.06)}
.ic-sc.aspetta,.ic-sc.bloccata{border-color:color-mix(in srgb,#ff5b1f 45%,transparent)}
.ic-alto{display:flex;align-items:center;gap:10px;min-width:0}
.ic-alto .av{width:30px;height:30px;border-radius:8px;font-size:11px;flex:none}
.ic-nm{min-width:0;flex:1}
.ic-nm .t{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-nm .p{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.ic-pal{width:8px;height:8px;border-radius:50%;background:var(--ink3);position:relative;flex:none}
.lavora>.ic-alto .ic-pal,.ic-blocco.lavora .ic-pal{background:var(--ink)}
.lavora>.ic-alto .ic-pal::after,.ic-blocco.lavora .ic-pal::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;animation:icPulsa 1.8s ease-out infinite}
@keyframes icPulsa{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.aspetta>.ic-alto .ic-pal,.bloccata>.ic-alto .ic-pal,.ic-blocco.aspetta .ic-pal,.ic-blocco.bloccata .ic-pal{background:#ff5b1f}
.ic-blocco{display:flex;flex-direction:column;gap:7px;min-width:0}
.ic-blocco+.ic-blocco{border-top:1px solid var(--line);padding-top:9px}
.ic-chi{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;min-width:0}
.ic-chi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-chi .ad-tempo{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px;overflow:visible}
.ic-adesso{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;min-width:0}
.ic-adesso .ic-giro{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--fill2);border-top-color:var(--ink);animation:icGira .9s linear infinite;flex:none;margin-top:3px}
@keyframes icGira{to{transform:rotate(360deg)}}
.ic-adesso .tx{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic-adesso .tx.cambia{animation:oraNuova .45s ease}
.ic-passi{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ic-barra{flex:1;height:3px;border-radius:2px;background:var(--fill2);overflow:hidden}
.ic-barra i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .5s}
.ic-sotto{display:flex;flex-wrap:wrap;gap:5px}
.ic-sotto span{font-size:11px;padding:2px 8px 2px 6px;border-radius:6px;background:var(--fill);color:var(--ink2);display:flex;align-items:center;gap:5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-sotto span i{width:5px;height:5px;border-radius:50%;background:var(--ink);animation:icLampo 1.4s ease-in-out infinite;flex:none}
@keyframes icLampo{50%{opacity:.25}}
.ic-ultimo{font-size:12px;color:var(--ink2);display:flex;gap:6px;min-width:0}
.ic-ultimo .k{color:var(--ink3);flex:none}
.ic-ultimo .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-domanda{font-size:13px;line-height:1.45;background:var(--side);border-radius:10px;padding:10px 12px}
.ic-domanda .cosa{font-size:11.5px;color:var(--ink);font-weight:600;margin-bottom:3px}
.ic-domanda .tx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ic-tasti{display:flex;flex-wrap:wrap;gap:6px}
.ic-tasti button{font-size:12.5px;padding:5px 14px;border-radius:8px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.ic-tasti button.nero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ic-scrivi{display:none;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 10px;background:var(--side)}
.ic-sc:hover .ic-scrivi,.ic-scrivi:focus-within,.ic-sc.aspetta .ic-scrivi,.ic-sc.bloccata .ic-scrivi{display:flex}
.ic-scrivi input{flex:1;min-width:0;border:0;background:transparent;font:12.5px var(--sans);color:var(--ink);outline:none;padding:4px 0}
.ic-scrivi button{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
.ic-scrivi button svg{width:12px;height:12px;stroke:var(--bg)}
.ic-ferme{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ic-fr{display:grid;grid-template-columns:22px minmax(80px,180px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;font-size:12.5px;border-top:1px solid var(--line);text-align:left;width:100%}
.ic-fr:first-child{border-top:0}
.ic-fr:hover{background:var(--fill)}
.ic-fr .av{width:22px;height:22px;border-radius:6px;font-size:9px}
.ic-fr .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-fr .v{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-fr .q{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ic-altre{font-size:12px;color:var(--ink3);padding:8px 12px;border-top:1px solid var(--line);text-align:left;width:100%}
.ic-altre:hover{color:var(--ink)}
.ic-vuoto{color:var(--ink3);font-size:13px;padding:30px 0;text-align:center}
@container (max-width:620px){ .ic-fr{grid-template-columns:22px minmax(0,110px) minmax(0,1fr) auto} }

.ad-sa-meta{grid-area:meta;font-size:11px;color:var(--ink3);white-space:nowrap;justify-self:end;font-variant-numeric:tabular-nums}
.ad-sa-barra{position:absolute;left:37px;right:6px;bottom:1px;height:2px;border-radius:1px;background:var(--fill2);overflow:hidden}
.ad-sa-barra i{display:block;height:100%;background:var(--ink2);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.adesso.compatto .ad-salista{margin-top:6px;padding-top:6px}
.adesso.compatto .ad-sa{grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;grid-template-rows:18px;grid-template-areas:"t ora tempo";padding:3px 6px}
.adesso.compatto .ad-sa-ic,.adesso.compatto .ad-sa-meta,.adesso.compatto .ad-sa-barra{display:none}
.adesso.compatto .ad-sa-t{max-width:240px;font-weight:500}
.colonne.multi .adesso.compatto .ad-sa-t{max-width:130px}
.sa-riep{margin-bottom:6px}
.adesso:not(.compatto) .ad-alto .ad-riga{padding-right:24px}
.sa-riep .ad-riass{display:block;margin-top:5px}
.domanda{padding:14px}
.dom-testa{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.dom-ic{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}
.dom-chi{font-size:11.5px;color:var(--ink3)}
.dom-testo{font-size:14px;font-weight:500;line-height:1.4}
.dom-opz{display:flex;flex-direction:column;gap:6px}
.dom-opz button{display:flex;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:background .12s,border-color .12s,transform .12s}
.dom-opz button:hover{background:var(--fill);border-color:var(--ink3)}
.dom-opz button:active{transform:scale(.99)}
.dom-opz kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center;color:var(--ink2);flex:none}
.dom-opz b{font-weight:600;font-size:13.5px;display:block}
.dom-opz small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.dom-altro{display:flex;gap:6px;margin-top:8px}
.dom-altro input{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--fill);color:var(--ink);font:13px var(--sans);padding:8px 10px;outline:none}
.dom-altro input:focus{border-color:var(--ink3)}
.dom-altro button{font-size:12.5px;padding:0 12px;border-radius:10px;background:var(--fill2)}
.chiedi{display:flex;align-items:center;gap:8px;margin-top:8px;border-radius:10px;padding:6px 8px;background:var(--bg);border:1px solid var(--line);transition:border-color .15s}
.chiedi:focus-within{border-color:var(--ink3);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.chiedi-ic{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 11px var(--serif);flex:none}
.chiedi input{flex:1;border:0;background:none;outline:none;font:13px var(--sans);color:var(--ink);min-width:0}
.chiedi kbd{font:500 10px var(--sans);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.riga-juggl{margin:4px 0 6px;border:1px solid var(--line);background:var(--bg)}
.riga-juggl .nome{font-family:var(--sans);font-weight:600;letter-spacing:-.01em}
/* rename in place: the field covers the name in the row, like in the Finder */
.rin-campo{position:fixed;z-index:30;font:600 13.5px var(--sans);color:var(--ink);background:var(--bg);border:0;outline:none;border-radius:5px;padding:1px 5px;margin:0;box-shadow:0 0 0 2px var(--ink),0 3px 10px rgba(0,0,0,.18)}
.menu button .sc{float:right;margin-left:24px;color:var(--ink3);font-size:12px}
.menu button:hover .sc{color:inherit;opacity:.6}
/* internal links in replies (juggl://sessione/<id>, juggl://messaggio/<id>/<ora>): a chip with logo and name that opens the chat */
.jchip{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;max-width:100%;padding:2px 7px 2px 3px;margin:1px 0;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:500;line-height:20px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.md a.jchip,.jchip{text-decoration:none}
.jchip:hover{background:var(--fill);border-color:var(--ink3)}
.jchip:active{transform:scale(.97)}
.jchip .av{width:20px;height:20px;font-size:8px;flex:none}
.jchip .jt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jchip .jq{color:var(--ink2);font-weight:400;font-size:12px;white-space:nowrap}
.jchip.via .jt{color:var(--ink2)}
/* chips inside bubbles (12/11): they take the bubble colors, so they read both on the light bubble (dark theme) and on the dark one (light theme) */
.bolla .jchip,.wa-bb .jchip,.wa-bolla .jchip{background:color-mix(in srgb,var(--bollaink) 10%,var(--bolla));border-color:color-mix(in srgb,var(--bollaink) 26%,transparent);color:var(--bollaink)}
.bolla .jchip:hover,.wa-bb .jchip:hover,.wa-bolla .jchip:hover{background:color-mix(in srgb,var(--bollaink) 17%,var(--bolla));border-color:color-mix(in srgb,var(--bollaink) 45%,transparent)}
.bolla .jchip .jq,.wa-bb .jchip .jq,.wa-bolla .jchip .jq,.bolla .jchip.via .jt{color:color-mix(in srgb,var(--bollaink) 68%,var(--bolla))}
/* juggl-* cards inside bubbles (12/11): like chips, they take the bubble colors. Contrast of the items on the card
   background: full 14:1, "done" (75%) 6.7:1, "to do" (68%) 5.3:1 on the light bubble; even more on the dark one */
.bolla .jc,.wa-bb .jc,.wa-bolla .jc{--ink:var(--bollaink);--ink2:color-mix(in srgb,var(--bollaink) 75%,var(--bolla));--ink3:color-mix(in srgb,var(--bollaink) 68%,var(--bolla));
  --bg:color-mix(in srgb,var(--bollaink) 5%,var(--bolla));--line:color-mix(in srgb,var(--bollaink) 20%,transparent);--fill:color-mix(in srgb,var(--bollaink) 9%,transparent);
  --fill2:color-mix(in srgb,var(--bollaink) 14%,transparent);background:var(--bg);color:var(--ink);border-color:var(--line)}
/* "Chiedi a Juggl": suggestions when the field is empty (⌘J) */
.chiedi{position:relative}
.chiedi-sugg{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);z-index:35;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:5px;display:none;transform-origin:top center}
.chiedi-sugg.on{display:block;animation:sugg-entra .14s ease-out}
@keyframes sugg-entra{from{opacity:0;transform:translateY(-3px) scale(.99)}}
.chiedi-sugg .tit{font-size:11px;font-weight:600;color:var(--ink3);padding:5px 8px 3px}
.chiedi-sugg button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;font-size:13px;color:var(--ink)}
.chiedi-sugg button span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chiedi-sugg button small{color:var(--ink3);font-size:11px}
.chiedi-sugg button.on,.chiedi-sugg button:hover{background:var(--fill2)}
.salto-riga.juggl .av{background:var(--ink);color:var(--bg);font-family:var(--serif);font-weight:700}
.ad-alto{display:flex;gap:14px;align-items:stretch}
/* grid (17/11): Adesso box. Grey dots that light up in the text color; big word for the action */
.ad-griglia{display:grid;flex:none;align-self:center}
.ad-griglia.g5{grid-template-columns:repeat(5,7px);gap:5px;padding:0 4px}

/* ---------- Claude weekly quota: indicator at the bottom of the sidebar and usage panel ---------- */
:root{--tenue:#cf5a50}
@media (prefers-color-scheme: dark){:root{--tenue:#f08a80}}
.qlv-basso{--q:var(--ink2)}.qlv-medio{--q:var(--ink)}.qlv-alto{--q:var(--tenue)}
.q-anello{flex:none;display:block;transform:rotate(-90deg)}
.q-anello .tr{stroke:var(--fill2)}.q-anello .ar{stroke:var(--q);transition:stroke-dasharray .5s cubic-bezier(.2,.9,.25,1)}
.piede-quota{display:flex;align-items:center;gap:9px;width:100%;margin:9px -6px -4px;padding:5px 6px;border-radius:9px;text-align:left;width:calc(100% + 12px);transition:background .15s}

.quota-pop{position:fixed;z-index:60;width:388px;max-height:calc(100vh - 96px);overflow:auto;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.26);animation:sale .22s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
.quota-pop section{padding:14px 16px;border-top:1px solid var(--line)}
.quota-pop section:first-child{border-top:0}
.quota-pop h5{margin:0 0 9px;font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:baseline}
.quota-pop h5 small{text-transform:none;letter-spacing:0;font-weight:400}
.qp-testa{display:flex;align-items:center;gap:14px;padding-top:16px!important}

.qp-testa .qp-num span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 16px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--q);letter-spacing:-.02em}
.qp-testa h4{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.qp-testa p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
.qp-testa p small{display:block;color:var(--ink3);font-size:11px;margin-top:1px}
.qp-frase{margin:0;font-size:13px;line-height:1.45}
.qp-frase b{font-weight:600}
.qp-barra{position:relative;height:6px;border-radius:3px;background:var(--fill2);margin:11px 0 5px;overflow:hidden}
.qp-barra i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:var(--q)}
.qp-barra i.prev{background:repeating-linear-gradient(-45deg,var(--q) 0 2px,transparent 2px 5px);opacity:.45}
.qp-scala{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.qp-nota{display:block;margin-top:8px;font-size:11px;color:var(--ink3);line-height:1.4}

.qp-giorni small{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.qp-giorni b{font-size:10px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.qp-sess{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center;width:100%;text-align:left;padding:7px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:9px}
button.qp-sess:hover{background:var(--fill)}
.qp-sess .t{min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.qp-sess small{grid-column:1;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.qp-sess .b i{display:block;height:100%;background:var(--ink2);border-radius:2px}
.qp-cons{padding:9px 0;border-top:1px solid var(--line)}
.qp-cons:first-of-type{border-top:0;padding-top:0}

.qp-cons p b{font-weight:600}
.qp-cons p small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.qp-az{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.qp-az .tasto{height:24px;font-size:12px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}.qp-az .tasto:hover{background:var(--fill)}
.qp-vuoto{margin:0;font-size:12.5px;color:var(--ink2)}
.qp-piede{font-size:11px;color:var(--ink3);line-height:1.4;background:var(--fill)}
.piede-riga{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stima-riga{font-variant-numeric:tabular-nums;white-space:nowrap}
.riga-sa .st .stima-riga{font-size:11px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:10px;font-size:12.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* ---------- side-by-side columns (like cmux panes) ---------- */
.colonne{display:flex;flex:1;min-height:0;min-width:0;height:100%}
.colonna{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 0;background:var(--bg)}
.colonne.multi .colonna{min-width:280px}
.colonna{container-type:inline-size}
@container (max-width:760px){.barra .lab{display:none}}
.colonna.entra{animation:colEntra .26s cubic-bezier(.2,.9,.25,1)}
.colonna.esce{animation:colEsce .17s ease-in forwards;pointer-events:none}
@keyframes colEntra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes colEsce{to{opacity:0;transform:translateX(10px)}}
/* active column always clear: header with the line on top and the background slightly lit; the others dimmer */
.colonne.multi .colonna.attiva::after{content:"";position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);pointer-events:none;z-index:7}
.colonne.multi .colonna > .barra{position:relative;cursor:grab;transition:background .2s}
.colonne.multi .colonna > .barra::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:50% 50%;transition:transform .32s cubic-bezier(.2,.9,.25,1);pointer-events:none}
.colonne.multi .colonna.attiva > .barra{background:color-mix(in srgb,var(--ink) 4%,var(--bg))}
.colonne.multi .colonna.attiva > .barra::before{transform:scaleX(1)}
.colonne.multi .colonna > .barra > *{transition:opacity .2s}
.colonne.multi .colonna:not(.attiva) > .barra > :not(.col-nuovi){opacity:.5}
.colonne.multi .colonna:not(.attiva) > .barra:hover > *{opacity:.85}
.colonne.multi .colonna:not(.attiva) .compositore{opacity:.62;transition:opacity .2s}
.colonne.multi .colonna:not(.attiva) .compositore:hover{opacity:1}
.colonne.multi .colonna > .barra .r-titolo{cursor:inherit}
.testa-n{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:grid;place-items:center;font:600 10.5px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.colonna.attiva .testa-n{background:var(--ink);color:var(--bg);box-shadow:none}
.col-nuovi{flex:none;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 7px;border-radius:10px;background:var(--fill2);color:var(--ink);font:600 11px/1 var(--sans);font-variant-numeric:tabular-nums;animation:sale .38s cubic-bezier(.2,.9,.25,1)}
.col-nuovi::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.r-fissa svg{width:14px;height:14px}
.r-fissa{color:var(--ink3)}
.r-fissa.on{color:var(--ink)}
.r-fissa.on .pt{fill:currentColor}
.colonna.presa{opacity:.55;transition:opacity .15s}
.col-segno{position:fixed;z-index:45;width:3px;border-radius:2px;background:var(--ink);pointer-events:none;transition:left .12s cubic-bezier(.2,.9,.25,1)}
.colonna.lampo > .barra{animation:lampoCol .9s ease-out}
@keyframes lampoCol{0%,30%{background:color-mix(in srgb,var(--ink) 14%,var(--bg))}}
.col-n{flex:none;display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 4px;align-self:center;border-radius:4px;font:600 9.5px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);vertical-align:1px}
.col-n.on{background:var(--ink);color:var(--bg);box-shadow:none}
.riga.sel .col-n{color:var(--selink2);box-shadow:inset 0 0 0 1px var(--selink2)}
.riga.sel .col-n.on{background:var(--selink);color:var(--sel);box-shadow:none}
@media (prefers-reduced-motion:reduce){.col-nuovi,.colonna.lampo > .barra{animation:none}.colonne.multi .colonna > .barra::before{transition:none}}
.divisore{flex:none;width:1px;background:var(--line);position:relative;cursor:col-resize;z-index:8;transition:background .15s}
.divisore::before{content:"";position:absolute;top:0;bottom:0;left:-4px;right:-4px}

// ---- scan: normal on opening and after every action, deep on request (about 1 min) ----
async function scansionaMac(profonda) {

    MAC.inCoda = true; avanzaMac();   // the normal one finishes (a few seconds), then the deep one starts
    while (MAC.scansiona) await new Promise((r) => setTimeout(r, 400));
    MAC.inCoda = false;
  }
  MAC.scansiona = profonda ? "profonda" : "normale"; MAC.inizio = Date.now();

  let r; try { r = await invoke("mac_scansione", { profonda }); } catch (e) { r = { ok: false, msg: String(e) }; }
  clearInterval(MAC.avanzaT);
  if (r && r.disco) { MAC.scan = r; if (r.profonda && r.durata_s) scriviLS("macProfondaS", String(Math.round(r.durata_s))); }

}

async function azioneMac(nome, fn) {

<script>
// ---------- microphone in the input box (src-tauri/src/microphone.rs) ----------
// Click on the microphone or ⌥Space: records; again (or ↩): transcribes and puts the text in the input box, to review.
// Holding ⌥Space you speak as long as you hold it. Esc cancels. It never sends anything by itself.
(() => {
  const M = { stato: "", V: null, sess: null, id: 0, t0: 0, livelli: [], tasto: 0, nota: "", fase: "", timer: null, rid: 0 };
  const X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg>';
  const OK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.5 2.6 2.5L11 4"/></svg>';
  const durata = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const mb = (b) => Math.round(b / 1e6);

  function disegna() {
    for (const V of mostrate()) {
      const f = qv(V, "form"), b = qv(V, "micbar"); if (!f || !b) continue;
      const mia = M.stato && M.V === V;

      const tr = M.stato === "trascrive";
      if (b.dataset.st !== M.stato) {
        b.dataset.st = M.stato;
        b.className = "micbar r-micbar" + (tr ? " trascrive" : "");
        b.innerHTML = `<button type="button" class="mic-x r-micx" title="Annulla (Esc)">${X}</button>
          <span class="${tr ? "mic-giro" : "mic-punto"}"></span><span class="mic-t r-mict"></span>
          <canvas class="mic-onda r-miconda"></canvas><span class="mic-nota r-micnota"></span>
          <button type="button" class="invia r-micok" title="Fine: metti il testo nella casella (⌥Spazio o ↩)"${M.stato === "registra" ? "" : " disabled"}>${OK}</button>`;
      }
      const t = qv(V, "mict"); if (t) t.textContent = tr ? "" : durata((performance.now() - M.t0) / 1000);
      const n = qv(V, "micnota"); if (n) n.textContent = tr ? (M.fase === "pc" ? "Trascrivo sul PC dello studio…" : "Trascrivo…") : M.nota;
      onda(V);
    }
  }

    const c = qv(V, "miconda"); if (!c) return;
    const r = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; if (!w) return;
    if (c.width !== Math.round(w * r)) { c.width = Math.round(w * r); c.height = Math.round(h * r); }
    const g = c.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0); g.clearRect(0, 0, w, h);
    g.fillStyle = getComputedStyle(c).color || "#888";
    const passo = 4, n = Math.floor(w / passo), L = M.livelli, da = Math.max(0, L.length - n);
    for (let i = 0; i < n; i++) {
      const v = L[da + i]; if (v === undefined) continue;
      const a = Math.max(2, v * (h - 2));
      g.globalAlpha = 0.35 + 0.65 * Math.min(1, v * 1.4);
      g.fillRect(w - (L.length - da - i) * passo, (h - a) / 2, 2, a);

  }

  async function modello() {
    try {
      const s = await invoke("mic_stato");
      if (!s.modello && !s.scarica) { await invoke("mic_scarica_modello"); M.nota = `Scarico il riconoscimento vocale (${Math.round(s.totale / 1e6)} MB, una volta sola)${s.senza_gpu ? ". Senza scheda video la dettatura è più lenta" : ""}`; }
      else if (s.scarica) M.nota = `Scarico il riconoscimento vocale: ${Math.round(100 * s.fatti / s.totale)}%`;
      else M.nota = "";
      disegna();
    } catch {}
  }

  async function avvia(V) {
    if (M.stato || !V) return;
    const ta = qv(V, "risposta");
    if (!V.id || !ta || ta.disabled || qv(V, "form")?.hidden) return toast("Apri una sessione per dettare");

    disegna(); modello();
    const r = await invoke("mic_avvia").catch((e) => ({ ok: false, msg: String(e) }));
    if (M.stato !== "avvio") { if (r.ok) invoke("mic_annulla"); return; }   // cancelled while starting
    if (performance.now() - M.t0 > 1500) M.tasto = 0;   // there was the permission request: the "hold down" no longer counts

      chiudi();
      if (r.permesso === false && /Impostazioni/.test(r.msg || "")) invoke("mic_impostazioni");
      return toast(r.msg || "Microfono non avviato", 4200);

  }

  }

  });

  T.event.listen("mic-fase", (e) => { M.fase = e.payload?.fase || ""; disegna(); });
  T.event.listen("mic-modello", (e) => {
    const p = e.payload || {};
    if (p.errore) { M.nota = ""; toast("Riconoscimento vocale non scaricato: " + p.errore, 4000); }
    else if (p.pronto) { M.nota = ""; toast("Riconoscimento vocale pronto sul Mac", 2200); }
    else M.nota = `Scarico il riconoscimento vocale: ${Math.round(100 * p.fatti / p.totale)}% di ${mb(p.totale)} MB`;
    if (M.stato) disegna();
  });

    const m = e.target.closest(".r-mic, .r-micok, .r-micx"); if (!m) return;

    const V = vistaDi(m); if (!V) return;
    if (V !== VA() && typeof vaiCol === "function") { const i = viste.indexOf(V); if (i >= 0) vaiCol(i); }
    avvia(V);
  }, true);
  const tastoMic = (e) => e.code === "Space" && e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey;
  window.addEventListener("keydown", (e) => {
    if (tastoMic(e)) {

        <div class="imp-riga"><div class="tx"><b>App iPhone</b><small>Segui e rispondi alle chat di questo Mac dall'iPhone, nella stessa rete o con Tailscale</small></div><button class="interr ${PI?.accesa ? "on" : ""}" data-imp-funz="iphone" role="switch" aria-checked="${!!PI?.accesa}" title="${PI?.accesa ? "Spegni" : "Accendi"}"></button></div>
        ${PI?.accesa ? (PI.in_rete ? `<div class="imp-qr"><div class="qr">${PI.qr || ""}</div><div class="tx"><b>Inquadra con l'iPhone</b><small>Apri Juggl sull'iPhone e tocca Inquadra il codice QR. Il codice contiene la chiave di questo Mac: non mostrarlo ad altri.</small><span class="ind">${E([...(PI.lan || []), PI.tailscale].filter(Boolean).join(" · "))}</span><button class="tasto" data-imp="copia-codice">Copia codice</button></div></div>`
          : `<div class="imp-riga"><div class="tx"><b>Riavvia Juggl</b><small>Il collegamento con l'iPhone si apre al prossimo avvio.</small></div><button class="btn-nero" data-imp="riavvia">Riavvia ora</button></div>`) : ""}
        ${PI?.accesa && !PI.tailscale ? `<p class="imp-nota">Per usarlo fuori casa o dall'ufficio installa Tailscale sul Mac e sull'iPhone, poi riapri questa pagina.</p>` : ""}
      </div>
      ${funz.length ? `<div class="imp-sez"><h4>Funzioni</h4>${funz.map((x) => `<div class="imp-riga"><div class="tx"><b>${E(x.titolo)}</b><small>${E(x.descr)}</small></div><button class="interr ${x.accesa ? "on" : ""}" data-imp-funz="${E(x.id)}" role="switch" aria-checked="${x.accesa}" title="${x.accesa ? "Spegni" : "Accendi"}"></button></div>`).join("")}
        <p class="imp-nota">Si vedono solo le funzioni che trovano i loro strumenti su questo Mac. Alcune si applicano al prossimo avvio.</p></div>` : ""}
      <div class="imp-sez"><h4>Aiuto</h4>
        <div class="imp-riga"><div class="tx"><b>Importa progetti</b><small>Trova chat e progetti sul Mac e prepara una sessione per ognuno</small></div><button class="tasto" data-imp="importa">Importa…</button></div>
        <div class="imp-riga"><div class="tx"><b>Giro di Juggl</b><small>Cosa si vede e le scorciatoie principali</small></div><button class="tasto" data-imp="giro">Rivedi il giro</button></div>
        <div class="imp-riga"><div class="tx"><b>Benvenuto</b><small>Controlli, collegamento e permessi dall'inizio</small></div><button class="tasto" data-imp="benvenuto">Apri</button></div>
      </div>
      <div class="piedef"><small>Esc per chiudere</small><button class="btn-nero" data-imp="chiudi">Fatto</button></div>`;
  }

  async function apri(cerca) {
    P = await inv("profilo"); AGG = await inv("aggiornamento_stato"); PI = await inv("ponte_info").catch(() => null); LIC = await inv("licenza_stato").catch(() => null);
    const f = q("#foglio"); f.classList.remove("salto"); f.classList.add("imp");
    q("#velo").classList.add("on");
    disegna();
    if (cerca) cercaOra();
  }
  async function cercaOra() {
    cercando = true; disegna();
    AGG = await inv("aggiornamento_cerca"); cercando = false;
    if (AGG.pronto) mostraPronto(AGG.pronto); else if (!AGG.errore && AGG.possibile !== false) avviso("Hai già l'ultima versione");
    disegna();
  }
  // the sheet closes with the usual interface (chiudiNuova): I remove the class when the veil closes
  new MutationObserver(() => { if (!q("#velo").classList.contains("on")) q("#foglio").classList.remove("imp"); }).observe(q("#velo"), { attributes: true, attributeFilter: ["class"] });

  function lavorano() { try { return (dati.sessioni || []).filter((x) => x.vista === "lavora").length; } catch { return 0; } }
  async function riavvia() {
    const n = lavorano();
    q("#foglio").classList.remove("imp");
    if (n && typeof conferma === "function" && !(await conferma("Riavviare Juggl adesso?", `${n === 1 ? "Una sessione sta" : n + " sessioni stanno"} lavorando: ${n === 1 ? "continua" : "continuano"} anche durante il riavvio.`, "Riavvia"))) return;
    // Windows: the downloaded update installs now (the installer closes and reopens Juggl)
    if (/Windows/.test(navigator.userAgent) && await inv("aggiornamento_installa").catch(() => false)) return;
    inv("plugin:process|restart");
  }
  function mostraPronto(info) {
    if (q("#agg-pronto")) return;
    const el = document.createElement("div");
    el.className = "agg-pronto"; el.id = "agg-pronto";
    el.innerHTML = `<b>Aggiornamento pronto</b><small>Juggl ${E(info.versione)} parte al prossimo riavvio.</small><div class="az"><button class="btn-nero" data-imp="riavvia">Riavvia ora</button><button class="tasto" data-imp="dopo">Più tardi</button></div>`;
    q("#piede")?.before(el);
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-imp]");
    if (b) {
      const a = b.dataset.imp;
      if (a === "chiudi") return typeof chiudiNuova === "function" && chiudiNuova();
      if (a === "cerca") return cercaOra();
      if (a === "licenza-rinnova") { LIC = await inv("licenza_rinnova").catch(() => LIC); avviso(LIC?.valida ? "Licenza rinnovata" : "Licenza non valida", 2200); return disegna(); }
      if (a === "account-esci") {
        q("#foglio").classList.remove("imp");
        if (typeof conferma === "function" && !(await conferma("Uscire dall'account?", "Juggl si blocca finché non rientri con email e codice. Le chat già al lavoro continuano.", "Esci"))) return apri();
        LIC = await inv("account_esci").catch(() => LIC); typeof chiudiNuova === "function" && chiudiNuova(); return;
      }
      if (a === "riavvia") return riavvia();
      if (a === "dopo") { q("#agg-pronto")?.remove(); return avviso("Lo uso alla prossima apertura di Juggl", 2200); }
      if (a === "giro" || a === "benvenuto" || a === "importa") { typeof chiudiNuova === "function" && chiudiNuova(); return inv("benvenuto_apri", { passo: a === "benvenuto" ? "" : a }); }
      if (a === "dett-veloce" || a === "dett-precisa") { const r = await inv("mic_imposta_qualita", { qualita: a.slice(5) }); if (!r.ok) avviso("Non riuscito: " + (r.msg || ""), 2600); else avviso(r.modello_presente ? "Dettatura " + r.qualita : `Dettatura ${r.qualita}: scarico il modello (${r.mb} MB) alla prossima dettatura`, 3200); }
      if (a === "collega") { const r = await inv("hook_installa"); avviso(r.ok ? "Collegato a Claude Code" : "Non riuscito: " + (r.msg || ""), 2600); }
      if (a === "togli") {
        q("#foglio").classList.remove("imp");
        if (typeof conferma === "function" && !(await conferma("Disinstallare il collegamento?", "Tolgo solo gli hook di Juggl da ~/.claude/settings.json, dopo averne fatto una copia. Le sessioni nuove non compariranno più qui finché non lo ricolleghi.", "Disinstalla"))) return apri();
        const r = await inv("hook_togli"); avviso(r.ok ? "Collegamento tolto" : "Non riuscito: " + (r.msg || ""), 2600);
        return apri();
      }
      if (a === "copia-codice") { const ok = await inv("copia_testo", { testo: PI?.link || "" }); return avviso(ok ? "Codice copiato: incollalo nell'app iPhone" : "Non riuscito", 2400); }
      P = await inv("profilo"); return disegna();
    }
    const fz = e.target.closest("[data-imp-funz]");
    if (fz) {
      const on = !fz.classList.contains("on");
      const r = await inv("profilo_imposta", { chiave: "funzioni." + fz.dataset.impFunz, valore: on });
      if (r.ok) { P = await inv("profilo"); PI = await inv("ponte_info").catch(() => null); disegna(); if (typeof dati !== "undefined") dati.funzioni = r.attive; }
    }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id !== "imp-nome") return;
    const r = await inv("profilo_imposta", { chiave: "nome", valore: e.target.value });
    if (r.ok) avviso("Nome salvato");
  });
  TT.event.listen("impostazioni", () => apri(false));
  TT.event.listen("aggiornamenti", () => apri(true));
  TT.event.listen("aggiornamento", (ev) => { AGG = { ...(AGG || {}), pronto: ev.payload }; mostraPronto(ev.payload); disegna(); });
  TT.event.listen("licenza", (ev) => { LIC = ev.payload; disegna(); });
  inv("aggiornamento_stato").then((s) => { AGG = s; if (s.pronto) mostraPronto(s.pronto); }).catch(() => {});
})();
</script>
