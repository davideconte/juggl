name: Idea or feature request
description: Something Juggl could do better or should do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in your way today when you work with many agent sessions?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
